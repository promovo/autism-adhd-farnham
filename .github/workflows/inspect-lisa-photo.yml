name: Inspect original Lisa woodland photo
on:
  push:
    paths:
      - .github/workflows/inspect-lisa-photo.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow requests
      - name: Save real Lisa portrait as internal reference
        run: |
          python - <<'PY'
          import requests, io, os
          from PIL import Image
          url='https://static.wixstatic.com/media/9df129_a8be2a6dcc5f44029e859d71512b9881~mv2.jpg'
          req=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          req.raise_for_status()
          image=Image.open(io.BytesIO(req.content)).convert('RGB')
          image.thumbnail((900,1200))
          os.makedirs('images/clinicians',exist_ok=True)
          image.save('images/clinicians/lisa-reference.webp',quality=85)
          print('Lisa photo size',image.size)
          PY
      - name: Commit reference image
        run: |
          git config user.name "promovo-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/clinicians/lisa-reference.webp
          git diff --cached --quiet || git commit -m "Add Lisa background image as reference for clinician portraits"
          git push
