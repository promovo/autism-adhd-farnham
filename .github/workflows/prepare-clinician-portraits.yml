name: Prepare consistent clinician portraits
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-clinician-portraits.yml
permissions:
  contents: write
jobs:
  create-portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and portrait restoration tools
        run: |
          pip install "rembg[cpu]==2.0.67" "Pillow>=10" requests "simple-lama-inpainting==0.1.2"
      - name: Restore genuine Lisa garden and match all head-and-shoulder framing
        env:
          U2NET_HOME: ${{ github.workspace }}/.model-cache
        run: python scripts/prepare_clinician_portraits.py
      - name: Store the edited portraits and QA review sheet
        run: |
          git config user.name "promovo-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/clinicians/*.webp images/clinicians/portrait-review.jpg images/clinicians/portrait-metadata.json
          git diff --cached --quiet || git commit -m "Refine woodland depth, consistent face size and natural head-and-shoulder crops"
          git push
