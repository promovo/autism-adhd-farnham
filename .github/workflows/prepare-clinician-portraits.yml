name: Prepare consistent clinician portraits
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-clinician-portraits.yml
permissions:
  contents: write
jobs:
  create-portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and portrait restoration tools
        run: |
          pip install "rembg[cpu]==2.0.67" "Pillow>=10" requests
          pip install --no-deps "simple-lama-inpainting==0.1.2"
          pip install fire==0.5.0
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install --force-reinstall "opencv-python-headless==4.12.0.88" "numpy>=2.0,<2.3"
          python -c "import cv2; print('OpenCV',cv2.__version__); assert hasattr(cv2,'CascadeClassifier')"
      - name: Restore genuine Lisa garden and match all head-and-shoulder framing
        env:
          U2NET_HOME: ${{ github.workspace }}/.model-cache
        run: python scripts/prepare_clinician_portraits.py
      - name: Store the edited portraits and QA review sheet
        run: |
          git config user.name "promovo-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/clinicians/*.webp images/clinicians/portrait-review.jpg images/clinicians/portrait-metadata.json
          git diff --cached --quiet || git commit -m "Refine woodland depth, consistent face size and natural head-and-shoulder crops"
          git push
