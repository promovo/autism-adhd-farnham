name: Prepare consistent clinician portraits
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-clinician-portraits.yml
permissions:
  contents: write
jobs:
  create-portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and portrait restoration tools
        run: |
          pip install "rembg[cpu]==2.0.67" "Pillow>=10" requests "opencv-python-headless==4.12.0.88" "numpy>=2.0,<2.3" "scipy>=1.11,<1.16"
          python -c "import cv2; print('OpenCV',cv2.__version__); assert hasattr(cv2,'CascadeClassifier')"
      - name: Assemble photos onto restored Lisa garden with consistent head and shoulder proportions
        env:
          U2NET_HOME: ${{ github.workspace }}/.model-cache
        run: python scripts/prepare_clinician_portraits.py
      - name: Refresh all review-page asset references so new image edges are visible
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=0
          old="20261123hairlines4"
          new="20261123hairlines5"
          for p in [Path("app1.js"),Path("app3.js"),*Path(".").glob("**/index.html")]:
              if ".git" in p.parts or not p.is_file():
                  continue
              text=p.read_text(encoding="utf-8")
              if old in text:
                  p.write_text(text.replace(old,new),encoding="utf-8")
                  changed+=1
          print(f"Refreshed corrected portrait and script cache versions across {changed} pages/files")
          if changed < 3:
              raise RuntimeError("Missing expected review-site asset references")
          PY
      - name: Store the edited portraits and QA review sheet
        run: |
          git config user.name "promovo-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/clinicians/*.webp images/clinicians/portrait-review.jpg images/clinicians/portrait-metadata.json
          git add -u
          git diff --cached --quiet || git commit -m "Retouch clinician hairline edges and update review-site photos"
          git push
