name: QA client review preview screenshots
on:
  push:
    paths:
      - '.github/workflows/qa-client-review.yml'
      - 'index.html'
      - 'client-review-nov23.css'
      - 'app1.js'
      - 'app2.js'
      - 'app3.js'
      - 'app4.js'
      - 'navigation-review.js'
  workflow_dispatch:

concurrency:
  group: client-review-qa-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install screenshot runtime
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Capture rendered pages and styles
        run: |
          cat > /tmp/review-preview.cjs <<'JS'
          const puppeteer=require(process.cwd()+'/node_modules/puppeteer-core');
          const fs=require('fs');
          const url='https://autism-adhd-farnham-review-v2.onrender.com/';
          const routes=["/","/choose-your-assessment","/how-assessments-work","/fees","/our-team","/contact","/faq","/adult-assessments","/adult-autism-assessment","/adult-adhd-assessment","/combined-adult-autism-adhd-assessment","/autism-adhd-women","/child-young-person-assessments","/child-autism-assessment","/child-adhd-assessment","/combined-child-autism-adhd-assessment","/pda-demand-avoidant-presentation","/post-assessment-advice","/local-resources","/ehcp-expert-witness-reports","/adult-pre-booking","/child-pre-booking","/free-consultation","/privacy-policy"];
          const map={};
          const paletteViolations=[];
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage'],headless:true});
            try{
              for(const route of routes){
                const page=await browser.newPage();
                await page.setViewport({width:1512,height:1000,deviceScaleFactor:1});
                await page.goto(url+(route==='/'?'':'?review='+encodeURIComponent(route)),{waitUntil:'domcontentloaded',timeout:40000});
                await new Promise(r=>setTimeout(r,900));
                const key=route==='/'?'home':route.slice(1);
                const data=await page.evaluate(()=>{
                  const css=(sel)=>{const el=document.querySelector(sel);if(!el)return null;const s=getComputedStyle(el);return {background:s.backgroundColor,backgroundImage:s.backgroundImage,backgroundPosition:s.backgroundPosition,backgroundSize:s.backgroundSize,color:s.color,boxShadow:s.boxShadow,font:s.fontFamily,textTransform:s.textTransform,fontWeight:s.fontWeight,height:el.getBoundingClientRect().height};};
                  const pseudo=(sel,which)=>{const el=document.querySelector(sel);if(!el)return null;const v=getComputedStyle(el,which);return {display:v.display,content:v.content,opacity:v.opacity,zIndex:v.zIndex,backgroundImage:v.backgroundImage,backgroundPosition:v.backgroundPosition,filter:v.filter};};
                  return {
                    route:location.href,heading:document.querySelector('h1')?.textContent,mainLength:document.querySelector('#app')?.textContent?.length,
                    cardCounts:document.querySelectorAll('.card,.info-card,.specialist-card,.clinician-card,.google-review-card').length,
                    navDropdowns:document.querySelectorAll('.nav-dropdown-menu').length,
                    hero:css('.mock-hero')||css('.page-hero'),
                    heroBefore:pseudo('.mock-hero','::before')||pseudo('.page-hero','::before'),
                    heroAfter:pseudo('.mock-hero','::after')||pseudo('.page-hero','::after'),
                    pathway:css('.pathway-grid .info-card'),
                    assessmentCard:css('.overview-service-cards .card'),card:css('#app .card'),team:css('.team-page'),
                    reviews:css('.google-review-card'),reviewText:css('.google-review-card p'),
                    start:css('.global-start-cta'),section:css('#app>.section'),
                    fee:css('.fees-current'),pdaPhoto:css('.pda-photo'),
                    link:css('#app .card a.inline'),homePrimaryCard:css('.why-grid>div'),
                    navItems:[...document.querySelectorAll('.nav-dropdown-menu a')].slice(0,8).map(e=>({text:e.textContent,style:getComputedStyle(e).textTransform})),
                    paletteSections:[...document.querySelectorAll('#app > section,#app > section > section,.google-reviews-section,.site-header,.footer')].map(e=>{const x=getComputedStyle(e);return {name:e.tagName+'.'+e.className,background:x.backgroundColor,hasImage:x.backgroundImage!=='none',visible:e.getBoundingClientRect().height>0}}),
                    reviewBand:css('.google-reviews-section'),
                    homeSpecialistDescriptions:[...document.querySelectorAll('.specialist-wrap .specialist-card p')].map(el=>({text:el.textContent.trim(),length:el.textContent.trim().length,lines:Math.round(el.getBoundingClientRect().height/parseFloat(getComputedStyle(el).lineHeight)),height:el.getBoundingClientRect().height})),
                    chooseSupportDescriptions:[...document.querySelectorAll('.specialist-overview .card p')].map(el=>({text:el.textContent.trim(),length:el.textContent.trim().length,lines:Math.round(el.getBoundingClientRect().height/parseFloat(getComputedStyle(el).lineHeight))})),
                    clinicFeature:{exists:!!document.querySelector('.assessment-clinic-feature'),background:document.querySelector('.assessment-clinic-feature')?getComputedStyle(document.querySelector('.assessment-clinic-feature')).backgroundColor:null,title:document.querySelector('.assessment-clinic-feature h2')?.textContent,photo:!!document.querySelector('.assessment-clinic-feature img')},
                    otherCardHeadings:[...document.querySelectorAll('#app .section .card h3,#app .section .fee-card h3,#app .section .soft-panel h3')].slice(0,15).map(el=>({text:el.textContent.replace(/\\s+/g,' ').trim(),size:getComputedStyle(el).fontSize,caps:getComputedStyle(el).textTransform})),
                    reviewTopBorder:getComputedStyle(document.querySelector('.google-reviews-section')).borderTopWidth,
                    bands:[...document.querySelectorAll('#app > section.section:not(.dark):not(.global-start-cta)')].map(e=>({name:e.className,background:getComputedStyle(e).backgroundColor,image:getComputedStyle(e).backgroundImage})),
                    titleColours:[...document.querySelectorAll('#app h1,#app h2,#app h3,#app h4,#app h5,#app h6')].filter(e=>e.getBoundingClientRect().height>0 && !e.closest('.specialist-wrap,.dark,.global-start-cta')).map(e=>({title:e.textContent.trim().slice(0,85),color:getComputedStyle(e).color})),
                    contactGoldButtons:[...document.querySelectorAll('.contact-start-cards a.btn')].map(e=>({text:e.textContent,color:getComputedStyle(e).color,background:getComputedStyle(e).backgroundColor})),
                    adultWhyIcons:[...document.querySelectorAll('.adult-why-grid .adult-why-icon')].map(e=>({width:Math.round(e.getBoundingClientRect().width),height:Math.round(e.getBoundingClientRect().height),cardWidth:Math.round(e.closest('.card').getBoundingClientRect().width),svgWidth:Math.round(e.querySelector('svg').getBoundingClientRect().width)})),
                    contactCardGaps:[...document.querySelectorAll('.contact-start-cards .card')].map(e=>{const h=e.querySelector('h3')?.getBoundingClientRect(),p=e.querySelector('p')?.getBoundingClientRect();return {title:e.querySelector('h3')?.textContent,gap:h&&p?Math.round(p.top-h.bottom):null}}),
                    childPathwayCardGaps:[...document.querySelectorAll('.child-pathway-grid .card')].map(e=>{const h=e.querySelector('h3'),p=e.querySelector('p');if(!h||!p)return null;const a=h.getBoundingClientRect(),b=p.getBoundingClientRect(),q=getComputedStyle(h);return {title:h.textContent.replace(/\\s+/g,' ').trim(),gap:Math.round(b.top-a.bottom),titleHeight:Math.round(a.height),minHeight:q.minHeight,bodyTop:Math.round(b.top)}}),
                    postIcons:[...document.querySelectorAll('.post-one .support-icon')].map(e=>({width:getComputedStyle(e).width,height:getComputedStyle(e).height,background:getComputedStyle(e).backgroundColor,svgWidth:getComputedStyle(e.querySelector('svg')).width,stroke:getComputedStyle(e.querySelector('svg')).stroke})),
                    buttonTypography:[...document.querySelectorAll('.btn')].filter(e=>e.getBoundingClientRect().height>0).map(e=>{const t=getComputedStyle(e);return {text:e.textContent.trim().slice(0,60),fontFamily:t.fontFamily,fontSize:t.fontSize,fontWeight:t.fontWeight,textTransform:t.textTransform,letterSpacing:t.letterSpacing}}),
                    faqTopicGroups:[...document.querySelectorAll('#app .faq-topic-group')].map(e=>({heading:e.querySelector('h2')?.textContent.trim(),color:getComputedStyle(e).backgroundColor,details:e.querySelectorAll('details').length,visible:e.getBoundingClientRect().height>0})),
                    teamDisciplineCards:[...document.querySelectorAll('.team-disciplines > .card')].map(e=>{const h=e.querySelector('h3'),p=e.querySelector('p'),a=e.getBoundingClientRect(),b=h.getBoundingClientRect(),c=p.getBoundingClientRect(),ps=getComputedStyle(p);return {title:h.textContent.trim(),paragraph:p.textContent.trim(),paragraphLines:Math.round(c.height/parseFloat(ps.lineHeight)),titleToTextGap:Math.round(c.top-b.bottom),blankBottom:Math.round(a.bottom-c.bottom),cardHeight:Math.round(a.height),minTitleHeight:getComputedStyle(h).minHeight}}),
                    cliniciansBand:css('.clinicians-home'),
                    cliniciansInner:css('.clinicians-home > .mock-section'),
                    cliniciansCarousel:css('.clinicians-home .clinician-row.clinician-carousel'),
                    cliniciansPortraitFrame:css('.clinicians-home .portrait-frame'),
                    cliniciansCard:css('.clinicians-home .clinician-card'),
                    firstSection:css('#app > .page-hero + .section, #app > .mock-hero + .mock-section'),
                    consultationTagStyles:[...document.querySelectorAll('#app .consultation-form-cards .card > .tag')].map(e=>({text:e.textContent,color:getComputedStyle(e).color,textTransform:getComputedStyle(e).textTransform,fontSize:getComputedStyle(e).fontSize})),
                    typography:Object.fromEntries(
                      ['.consultation-form-cards .card .tag','.consultation-form-cards .card h3','.consultation-form-cards .card p','.consultation-form-cards .card a.btn','.consultation-first .section-lead h2',
                       '.overview-service-cards .card .tag','.overview-service-cards .card h3','.overview-service-cards .card p','.overview-service-cards .card a.inline',
                       '.overview-age-cards .card h3','.overview-age-cards .card p','.fees-grid .fee-card .tag','.fees-grid .fee-card h3','.fees-grid .fee-card p','.fees-grid .fee-card a.inline',
                       '.contact-start-cards .card h3','.contact-start-cards .card p','.section-lead h2','.card h3','.card .tag','.card p','.card a.btn']
                      .map(sel=>{const el=document.querySelector('#app '+sel);if(!el)return [sel,null];const v=getComputedStyle(el);return [sel,{fontSize:v.fontSize,fontFamily:v.fontFamily,fontWeight:v.fontWeight,textTransform:v.textTransform,lineHeight:v.lineHeight,letterSpacing:v.letterSpacing,color:v.color}]}).filter(x=>x[1])
                    ),
                    consultationBookingVisible:!!document.querySelector('#app .consultation-booking'),
                    consultationNoteInStep2:!!document.querySelector('#app .consultation-second .consultation-important-note'),
                    personalNameInPageCopy:(document.querySelector('#app')?.innerText||'').replace(/lisa@autismassessmentsfarnham\\.co\\.uk/gi,'').match(/\\bLisa\\b/g)?.length||0,
                    homeChooseButton:css('.why-section .why-cta a[href="/choose-your-assessment"],.why-section .why-cta a[href*="%2Fchoose-your-assessment"]'),
                    homeCombinedButtons:[...document.querySelectorAll('.pathway-extra-actions a')].map(e=>({text:e.textContent,background:getComputedStyle(e).backgroundColor})),
                    consoleErrorCount:window.__qaErrors||0
                  };
                });
                if(!data.heading||data.mainLength<180||data.heading.includes('Page not found')){
                  throw Error('Page route missing or empty: '+route+JSON.stringify(data));
                }
                if(data.navDropdowns!==4)throw Error('Dropdown navigation unavailable on '+route);
                if(!data.start?.backgroundImage.includes('static.wixstatic.com/media/9df129_')){
                  throw Error('Missing woodland footer CTA on '+route);
                }
                if(data.reviews?.background!=='rgb(253, 249, 243)'){
                  throw Error('Inconsistent review card background on '+route);
                }
                if(route!=='/'){
                  const baseline=map['/']?.hero;
                  if(data.hero.backgroundImage!==baseline?.backgroundImage){
                    throw Error('HERO OVERLAY NOT MATCHED: '+route+' / home='+baseline?.backgroundImage+' / inner='+data.hero.backgroundImage);
                  }
                  if(data.hero.backgroundPosition!==baseline?.backgroundPosition){
                    throw Error('HERO IMAGE POSITION NOT MATCHED: '+route+' / home='+baseline?.backgroundPosition+' / inner='+data.hero.backgroundPosition);
                  }
                  for(const layer of ['heroBefore','heroAfter']){
                    const homeLayer=map['/']?.[layer];
                    const innerLayer=data[layer];
                    if(innerLayer?.backgroundImage!==homeLayer?.backgroundImage || innerLayer?.display!==homeLayer?.display || innerLayer?.opacity!==homeLayer?.opacity || innerLayer?.filter!==homeLayer?.filter){
                      throw Error('VISIBLE HERO LAYER MISMATCH: '+route+' '+layer+' home='+JSON.stringify(homeLayer)+' inner='+JSON.stringify(innerLayer));
                    }
                  }
                }
                const approvedBackgrounds=new Set(['rgb(226, 236, 218)','rgb(199, 221, 190)','rgb(41, 75, 59)','rgb(253, 249, 243)']);
                const invalid=data.paletteSections.filter(x=>x.visible && !x.hasImage && x.background!=='rgba(0, 0, 0, 0)' && !approvedBackgrounds.has(x.background));
                if(invalid.length)paletteViolations.push('UNAPPROVED SITE BACKGROUND ON '+route+': '+JSON.stringify(invalid));
                if(data.reviewBand?.background!=='rgb(226, 236, 218)')paletteViolations.push('REVIEWS SHADE DOES NOT MATCH APPROVED GREEN: '+route);
                if(route!=='/'){
                  const expectedBands=data.bands.map((b,i)=>i%2===1?'rgb(253, 249, 243)':((i>0&&i%4===2)||i===data.bands.length-1?'rgb(199, 221, 190)':'rgb(226, 236, 218)'));
                  data.bands.forEach((band,i)=>{
                    if(band.background!==expectedBands[i] || band.image!=='none')paletteViolations.push('SECTION ALTERNATION FAIL: '+route+' #'+i+' '+JSON.stringify(band)+' wanted '+expectedBands[i]);
                  });
                  const wantBorder='0px';
                  if(data.reviewTopBorder!==wantBorder)paletteViolations.push('UNEXPECTED GOOGLE REVIEWS BORDER '+route+': '+data.reviewTopBorder+' expected '+wantBorder);
                }
                if(route!=='/'&&data.otherCardHeadings.some(x=>x.size!=='20px'||x.caps!=='uppercase')){
                  paletteViolations.push('CARD TITLE NOT 20PX UPPERCASE '+route+': '+JSON.stringify(data.otherCardHeadings.filter(x=>x.size!=='20px'||x.caps!=='uppercase')));
                }
                if(route==='/choose-your-assessment' && (!data.clinicFeature.exists||data.clinicFeature.background!=='rgb(253, 249, 243)'||!data.clinicFeature.photo||!data.clinicFeature.title)){
                  paletteViolations.push('CLINIC CONTENT PANEL NOT VISIBLE '+JSON.stringify(data.clinicFeature));
                }
                if(route==='/' && (data.homeSpecialistDescriptions.length!==4 || Math.max(...data.homeSpecialistDescriptions.map(x=>x.length))-Math.min(...data.homeSpecialistDescriptions.map(x=>x.length))>20)){
                  paletteViolations.push('HOME SPECIALIST PARAGRAPHS UNBALANCED '+JSON.stringify(data.homeSpecialistDescriptions));
                }
                if(route==='/faq'){
                  const expected=['rgb(226, 236, 218)','rgb(253, 249, 243)','rgb(199, 221, 190)','rgb(253, 249, 243)','rgb(226, 236, 218)','rgb(199, 221, 190)'];
                  if(data.faqTopicGroups.length!==6||data.faqTopicGroups.some((g,i)=>g.color!==expected[i]||!g.details||!g.visible)){
                    paletteViolations.push('FAQ GROUPS NOT CONTRASTING: '+JSON.stringify(data.faqTopicGroups));
                  }
                }
                if(data.buttonTypography.some(x=>x.fontSize!=='13px'||x.fontWeight!=='700'||x.textTransform!=='uppercase'||!x.fontFamily.includes('DM Sans'))){
                  paletteViolations.push('BUTTON FONT MISMATCH '+route+' '+JSON.stringify(data.buttonTypography.filter(x=>x.fontSize!=='13px'||x.fontWeight!=='700'||x.textTransform!=='uppercase'||!x.fontFamily.includes('DM Sans'))));
                }
                if(route==='/our-team' && (data.teamDisciplineCards.length!==5||data.teamDisciplineCards.some(x=>x.titleToTextGap>11||x.minTitleHeight!=='0px'))){
                  paletteViolations.push('TEAM CARD SPACING ISSUE '+JSON.stringify(data.teamDisciplineCards));
                }
                if(data.titleColours.some(t=>t.color!=='rgb(16, 46, 32)'))paletteViolations.push('TITLE COLOUR INCONSISTENCY '+route+' '+JSON.stringify(data.titleColours.filter(t=>t.color!=='rgb(16, 46, 32)')));
                if(route==='/contact' && (data.contactGoldButtons.length!==3 || data.contactGoldButtons.some(x=>x.color!=='rgb(255, 249, 232)'||x.background!=='rgb(194, 154, 26)')))paletteViolations.push('CONTACT BUTTON COLOUR FAIL '+JSON.stringify(data.contactGoldButtons));
                if(route==='/adult-assessments' && (data.adultWhyIcons.length!==4||data.adultWhyIcons.some(x=>x.width!==66||x.height!==66||x.svgWidth!==44||x.cardWidth<180))){
                  paletteViolations.push('ADULT INFOGRAPHIC BOX OVERSIZED '+JSON.stringify(data.adultWhyIcons));
                }
                if(route==='/contact' && (data.contactCardGaps.length!==3||data.contactCardGaps.some(x=>x.gap>10||x.gap<0))){
                  paletteViolations.push('CONTACT TITLE TO BODY GAP STILL TOO LARGE '+JSON.stringify(data.contactCardGaps));
                }
                if(route==='/child-young-person-assessments' && (data.childPathwayCardGaps.length!==4||data.childPathwayCardGaps.some(x=>!x||x.gap>10||x.gap<0||x.minHeight!=='0px'))){
                  paletteViolations.push('CHILD PATHWAY TITLE TO BODY GAP TOO LARGE '+JSON.stringify(data.childPathwayCardGaps));
                }
                if(route!=='/' && data.bands.some((band,i)=>i>0&&band.background===data.bands[i-1].background)){
                  paletteViolations.push('ADJACENT CONTENT SECTIONS SAME COLOUR '+route+': '+JSON.stringify(data.bands));
                }
                if(route!=='/'&&data.bands.length&&data.bands.at(-1).background===data.reviewBand?.background){
                  paletteViolations.push('LAST CONTENT SECTION SAME COLOUR AS REVIEWS '+route);
                }
                if(route==='/post-assessment-advice' && (data.postIcons.length!==6 || data.postIcons.some(x=>x.width!=='66px'||x.height!=='66px'||x.svgWidth!=='44px'||x.stroke!=='rgb(213, 173, 51)')))paletteViolations.push('POST-ASSESSMENT ICON STYLE FAIL '+JSON.stringify(data.postIcons));
                if(data.firstSection?.background!==(data.bands.length===1?'rgb(199, 221, 190)':'rgb(226, 236, 218)')){
                  paletteViolations.push('FIRST SECTION NOT APPROVED GREEN: '+route+' value='+JSON.stringify(data.firstSection));
                }
                if(route==='/free-consultation'){
                  if(data.consultationBookingVisible)paletteViolations.push('UNWANTED CONSULTATION BOOKING SECTION STILL PRESENT');
                  if(!data.consultationNoteInStep2)paletteViolations.push('IMPORTANT NOTE NOT MOVED INTO STEP 2');
                  if(data.consultationTagStyles.length!==2||data.consultationTagStyles.some(t=>t.color!=='rgb(167, 123, 18)'||t.textTransform!=='uppercase')){
                    paletteViolations.push('CONSULTATION TOP CARD LABELS NOT GOLD UPPERCASE: '+JSON.stringify(data.consultationTagStyles));
                  }
                }
                const type=data.typography||{};
                const cardHeading=type['.card h3'];
                const cardBody=type['.card p'];
                const cardTag=type['.card .tag'];
                const cardButton=type['.card a.btn'];
                if(cardHeading&&cardHeading.fontSize!=='20px'){
                  paletteViolations.push('CARD HEADING NOT 20px: '+route+' '+JSON.stringify(cardHeading));
                }
                if(cardBody&&cardBody.fontSize!=='16px'){
                  paletteViolations.push('CARD BODY NOT 16px: '+route+' '+JSON.stringify(cardBody));
                }
                if(cardTag&&(cardTag.fontSize!=='14px'||cardTag.textTransform!=='uppercase'||cardTag.color!=='rgb(167, 123, 18)')){
                  paletteViolations.push('CARD KICKER NOT 14px GOLD UPPERCASE: '+route+' '+JSON.stringify(cardTag));
                }
                if(cardButton&&cardButton.fontSize!=='13px'){
                  paletteViolations.push('CARD BUTTON NOT 13px: '+route+' '+JSON.stringify(cardButton));
                }
                if(route!=='/' && route!=='/our-team' && data.personalNameInPageCopy!==0){
                  paletteViolations.push('UNWANTED PERSONAL NAME IN SERVICE COPY: '+route+' count='+data.personalNameInPageCopy);
                }
                if(route==='/'){
                  if(data.cliniciansBand?.background!=='rgb(253, 249, 243)' || data.cliniciansInner?.background!=='rgb(253, 249, 243)'){
                    paletteViolations.push('MISMATCHED HOME CLINICIAN BAND: '+JSON.stringify({outer:data.cliniciansBand?.background,inner:data.cliniciansInner?.background}));
                  }
                  if(data.cliniciansCarousel?.background!=='rgba(0, 0, 0, 0)'){
                    paletteViolations.push('CLINICIAN CAROUSEL HAS ADDITIONAL BACKING: '+data.cliniciansCarousel?.background);
                  }
                  if(data.homeChooseButton?.background!=='rgb(194, 154, 26)'){
                    paletteViolations.push('HOME CHOOSE ASSESSMENT BUTTON NOT GOLD: '+JSON.stringify(data.homeChooseButton));
                  }
                  if(data.homeCombinedButtons.some(b=>b.background!=='rgb(194, 154, 26)')){
                    paletteViolations.push('COMBINED ASSESSMENT BUTTON NOT GOLD: '+JSON.stringify(data.homeCombinedButtons));
                  }
                }
                const hoverAnchor=await page.$(route==='/contact'?'.contact-start-cards a.btn':'#app a.btn');
                if(hoverAnchor){
                  await hoverAnchor.hover();
                  await new Promise(r=>setTimeout(r,260));
                  const hoverState=await hoverAnchor.evaluate(e=>{const s=getComputedStyle(e);return {background:s.backgroundColor,color:s.color,transform:s.transform}});
                  data.buttonHover=hoverState;
                  if(hoverState.background!=='rgb(169, 130, 20)' || hoverState.color!=='rgb(255, 249, 232)'){
                    paletteViolations.push('GOLD BUTTON HOVER INCONSISTENCY '+route+' '+JSON.stringify(hoverState));
                  }
                }
                map[route]=data;
                const capture=new Set(['/','/choose-your-assessment','/how-assessments-work','/fees','/our-team','/faq','/adult-assessments','/child-young-person-assessments','/pda-demand-avoidant-presentation','/post-assessment-advice','/local-resources','/free-consultation','/contact']);
                if(capture.has(route)){
                  await page.screenshot({path:'qa/site-review/'+key+'.jpg',type:'jpeg',quality:72,fullPage:true});
                }
                if(route==='/'){
                  const clinicianSection=await page.$('.clinicians-home');
                  if(clinicianSection){
                    await clinicianSection.screenshot({path:'qa/site-review/clinicians-detail.jpg',type:'jpeg',quality:86});
                  }
                }
                console.log(route,data.heading,JSON.stringify({hero:data.hero,card:data.card,link:data.link,team:data.team,pdaPhoto:data.pdaPhoto,reviewText:data.reviewText}));
                await page.close();
              }
              // Mobile typography parity: same scale on consultation and other card pages.
              const mobileType={};
              for(const route of ['/free-consultation','/choose-your-assessment','/fees']){
                const mobile=await browser.newPage();
                await mobile.setViewport({width:390,height:844,deviceScaleFactor:1});
                await mobile.goto(url+'?review='+encodeURIComponent(route),{waitUntil:'domcontentloaded',timeout:40000});
                await new Promise(r=>setTimeout(r,450));
                const results=await mobile.evaluate(()=>{
                  const read=sel=>{const e=document.querySelector(sel);if(!e)return null;const s=getComputedStyle(e);return {size:s.fontSize,transform:s.textTransform,color:s.color}};
                  return {heading:read('#app .card h3'),label:read('#app .card .tag'),body:read('#app .card p')};
                });
                mobileType[route]=results;
                if(results.heading?.size!=='19px'||results.body?.size!=='16px'||(results.label&&(results.label.size!=='13px'||results.label.transform!=='uppercase'))){
                  paletteViolations.push('MOBILE CARD TYPOGRAPHY INCONSISTENT: '+route+' '+JSON.stringify(results));
                }
                await mobile.close();
              }
              map['_mobileTypography']=mobileType;
              fs.writeFileSync('qa/site-review/computed-styles.json',JSON.stringify(map,null,2));
              if(paletteViolations.length)throw Error('PALETTE ISSUES ON '+paletteViolations.length+' CHECKS\\n'+paletteViolations.join('\\n'));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          mkdir -p qa/site-review
          node /tmp/review-preview.cjs
      - name: Store visual QA only if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/site-review/
          if ! git diff --cached --quiet; then
            git commit -m "Capture rendered site review pages and computed styles"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X ours origin/main || { git rebase --abort; exit 1; }
              git push origin HEAD:main && exit 0
              sleep 2
            done
            exit 1
          fi
