name: Save Lisa garden backdrop plate
on:
  push:
    paths:
      - .github/workflows/save-lisa-garden-plate.yml
permissions:
  contents: write
jobs:
  save-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests Pillow
      - name: Download reconstructed empty garden with original Lisa foliage
        env:
          GARDEN_URL: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/f75007b8-27ca-4c4a-bd0c-93ef5f9efaf5/a0895d5c-3a91-498a-b4be-0ac730d02808/_lisa_is_a_genuine_photograph_of_a_woman_outdoors__surrounde.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjIwNmFlMGNiMWE3MDdiMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTQxMDMxNn0.NX5td0y11EhTWCIVZj7pzUqRzl1gJuyZgLLkc8spCQ4'
        run: |
          python - <<'PY'
          import os,io,requests
          from PIL import Image,ImageOps
          r=requests.get(os.environ['GARDEN_URL'],timeout=90)
          r.raise_for_status()
          im=Image.open(io.BytesIO(r.content)).convert("RGB")
          print("Source garden", im.size, len(r.content))
          im=ImageOps.fit(im,(600,750),method=Image.Resampling.LANCZOS)
          os.makedirs("images/clinicians",exist_ok=True)
          im.save("images/clinicians/lisa-garden-clean.webp",quality=92,method=6)
          PY
      - name: Commit permanent garden backdrop
        run: |
          git config user.name "promovo-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/clinicians/lisa-garden-clean.webp
          git diff --cached --quiet || git commit -m "Save seamless original-style garden backdrop for clinician photos"
          git push
